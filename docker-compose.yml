services:
  app:
    build: .
    depends_on:
      - maindb
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mydb
      - POSTGRES_DB=mydb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=maindb
      - POSTGRES_PORT=5432
      - OPENAI_CHAT_API_KEY=${OPENAI_CHAT_API_KEY}  
      - OPENAI_CHAT_API_VERSION=2024-12-01-preview
      - OPENAI_CHAT_API_BASE=${OPENAI_CHAT_API_BASE}
      - OPENAI_CHAT_DEPLOYMENT=gpt-4.1
      - OPENAI_EMBEDDING_API_KEY=${OPENAI_EMBEDDING_API_KEY}
      - OPENAI_EMBEDDING_API_BASE=${OPENAI_EMBEDDING_API_BASE}
      - OPENAI_EMBEDDING_API_VERSION=2023-05-15
      - OPENAI_EMBEDDING_DEPLOYMENT=text-embedding-ada-002
      - QTEST_REQUIREMENTS_API_URL=${QTEST_REQUIREMENTS_API_URL}
      - QTEST_TESTCASES_API_URL=${QTEST_TESTCASES_API_URL}
      - QTEST_TESTRUNS_API_URL=${QTEST_TESTRUNS_API_URL}
      - QTEST_DEFECTS_API_URL=${QTEST_DEFECTS_API_URL}
      - QTEST_API_KEY=${QTEST_API_KEY}
      - QTEST_REQUIREMENTS_PARENT_ID=11061822
      - QTEST_TESTCASES_PARENT_ID=11061822
      - PYTHONPATH=/app  # Ensure the app directory is in the Python path
    volumes:
      - .:/app
    command: python test/test_query_postgres.py  # Command to run the application

  maindb:
    image: pgvector/pgvector:pg17
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistent volume

volumes:
  postgres_data:  # Named volume for persistence
