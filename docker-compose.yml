version: '3.8'

services:
  app:
    container_name: qeintern2025_app
    build: 
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped 
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@qeintern2025_db:5432/mydb  # Fix this
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=qeintern2025_db  # Updated this to match container name
      - POSTGRES_PORT=${POSTGRES_PORT}
      - OPENAI_CHAT_API_KEY=${OPENAI_CHAT_API_KEY}  
      - OPENAI_CHAT_API_VERSION=2024-12-01-preview
      - OPENAI_CHAT_API_BASE=${OPENAI_CHAT_API_BASE}
      - OPENAI_CHAT_DEPLOYMENT=gpt-4.1
      - OPENAI_EMBEDDING_API_KEY=${OPENAI_EMBEDDING_API_KEY}
      - OPENAI_EMBEDDING_API_BASE=${OPENAI_EMBEDDING_API_BASE}
      - OPENAI_EMBEDDING_API_VERSION=2023-05-15
      - OPENAI_EMBEDDING_DEPLOYMENT=${OPENAI_EMBEDDING_DEPLOYMENT}
      - QTEST_REQUIREMENTS_API_URL=${QTEST_REQUIREMENTS_API_URL}
      - QTEST_TESTCASES_API_URL=${QTEST_TESTCASES_API_URL}
      - QTEST_TESTRUNS_API_URL=${QTEST_TESTRUNS_API_URL}
      - QTEST_DEFECTS_API_URL=${QTEST_DEFECTS_API_URL}
      - QTEST_API_KEY=${QTEST_API_KEY}
      - QTEST_REQUIREMENTS_PARENT_ID=11061822
      - QTEST_TESTCASES_PARENT_ID=11061822
      - PYTHONPATH=/app
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - AURA_INSTANCEID=${AURA_INSTANCEID}
      - AURA_INSTANCENAME=${AURA_INSTANCENAME}
    volumes:
      - .:/app:ro  # Changed from ./:/app:ro
    ports:
      - "8000:8000"
    depends_on:
      qeintern2025_db:  # Updated this to match container name
        condition: service_healthy
    networks:
      - app_network

  qeintern2025_db:  # Update service name to match container name
    container_name: qeintern2025_db
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment: 
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

networks:
  app_network:
    name: qeintern2025_network
    driver: bridge

volumes:
  postgres_data:
    name: qeintern2025_postgres_data_new